version: 2
updates:
  # 1. จัดการอัปเดต Go Engine (gomod)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    groups:
      golang-dependencies:
        patterns:
          - "*"

  # 2. จัดการอัปเดต GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 3
    
