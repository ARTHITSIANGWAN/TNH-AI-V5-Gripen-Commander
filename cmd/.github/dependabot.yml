version: 2
updates:
  - package-ecosystem: "gomod" # สำหรับ Go Engine ของไอ้จ๊อด
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      golang-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions" # สำหรับ CI/CD Workflows
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    
